<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>بلاتينيوم | إعادة تعيين كلمة المرور</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f1f5f9;color:#172238;font:16px system-ui}
    header{background:#122c52;color:#fff;padding:20px}
    main{max-width:620px;margin:32px auto;padding:0 15px}
    .panel{background:#fff;border:1px solid #d9e2ed;border-radius:15px;padding:24px}
    h1{font-size:23px;margin:0}
    h2{font-size:20px}
    label{display:block;margin:14px 0 6px}
    input{padding:12px;border:1px solid #aab7c8;border-radius:8px;width:100%;font:inherit}
    button{border:0;background:#173c70;color:#fff;border-radius:8px;padding:11px 16px;cursor:pointer;font:inherit;margin-top:16px}
    .status{white-space:pre-wrap;margin-top:18px;color:#7b3400}
    .ok{color:#176b36}
    a{color:#173c70}
    #formWrap{display:none}
  </style>
</head>
<body>
<header>
  <h1>PLATINUM ACADEMY | إعادة تعيين كلمة المرور</h1>
</header>
<main>
  <section class="panel">
    <div id="formWrap">
      <h2>تعيين كلمة مرور جديدة</h2>
      <form id="resetForm">
        <label>كلمة المرور الجديدة</label>
        <input type="password" id="p1" minlength="12" required autocomplete="new-password">

        <label>تأكيد كلمة المرور الجديدة</label>
        <input type="password" id="p2" minlength="12" required autocomplete="new-password">

        <button type="submit">حفظ كلمة المرور الجديدة</button>
      </form>
    </div>

    <p id="status" class="status">جارٍ التحقق من رابط الاستعادة...</p>
  </section>
</main>

<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
import {URL,KEY} from './config.js';

const sb = createClient(URL, KEY);
const statusEl = document.getElementById('status');
const formWrap = document.getElementById('formWrap');
const form = document.getElementById('resetForm');

function say(text, ok=false){
  statusEl.textContent = text;
  statusEl.className = ok ? 'status ok' : 'status';
}

async function showIfSession(){
  const {data:{session}, error} = await sb.auth.getSession();
  if(error){
    say('تعذر قراءة جلسة الاستعادة: ' + error.message);
    return;
  }
  if(session){
    formWrap.style.display='block';
    say('الرابط صالح. أدخل كلمة المرور الجديدة.');
  }else{
    say('لم يتم العثور على جلسة استعادة صالحة. افتح هذا الملف من رابط الاستعادة المرسل إلى بريدك.');
  }
}

sb.auth.onAuthStateChange((event, session)=>{
  if(event === 'PASSWORD_RECOVERY' || session){
    formWrap.style.display='block';
    say('الرابط صالح. أدخل كلمة المرور الجديدة.');
  }
});

setTimeout(showIfSession, 500);

form.addEventListener('submit', async (e)=>{
  e.preventDefault();

  const p1 = document.getElementById('p1').value;
  const p2 = document.getElementById('p2').value;

  if(p1 !== p2){
    say('كلمتا المرور غير متطابقتين.');
    return;
  }

  say('جارٍ حفظ كلمة المرور الجديدة...');

  const {error} = await sb.auth.updateUser({password:p1});
  if(error){
    say('تعذر تغيير كلمة المرور: ' + error.message);
    return;
  }

  await sb.auth.signOut();

  formWrap.style.display='none';
  say('تم تغيير كلمة المرور بنجاح. يمكنك الآن العودة إلى صفحة دخول المدير.', true);

  const p = document.createElement('p');
  const a = document.createElement('a');
  a.href = './admin.html';
  a.textContent = 'العودة إلى صفحة دخول المدير';
  p.appendChild(a);
  statusEl.after(p);

  history.replaceState({}, '', location.pathname);
});
</script>
</body>
</html>
